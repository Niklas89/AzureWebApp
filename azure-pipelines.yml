# Build on pushes to master.
trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'
  # The screenshots use name: 'Default' for a self-hosted pool.
  # Microsoft-hosted agents use vmImage without a pool name.

variables:
  buildConfiguration: Release

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Setup .NET
    inputs:
      packageType: sdk
      version: '10.0.x'

  - task: DotNetCoreCLI@2
    displayName: Restore dependencies
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: 'build'
      arguments: '--configuration $(buildConfiguration) --no-restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: 'test'
      projects: '**/*.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build --verbosity normal'

  - task: DotNetCoreCLI@2
    displayName: Publish
    inputs:
      command: 'publish'
      publishWebProjects: false
      # Publish the hosted server, which includes the Blazor client.
      projects: 'Server/AzureWebApp.Server.csproj'
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: Upload published app
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    displayName: Deploy to Azure App Service
    # Deploy only successful builds of master, excluding pull-request validation.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      # Azure Resource Manager service connection name in Azure DevOps.
      azureSubscription: 'MyResourceGroup'
      appType: 'webApp'
      appName: 'NiklasAzureWebApp'
      package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
